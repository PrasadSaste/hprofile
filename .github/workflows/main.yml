name: Hprofile Actions

on: 
  workflow_dispatch

jobs:
  Testing:
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout (Keep v4 as it is current)
      - name: Code checkout
        uses: actions/checkout@v4

      # 2. Setup Java FIRST (Upgraded to v4 for Node 24 support and stability)
      - name: Set Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Compile and run Maven Tests using the newly configured Java 21 environment
      - name: Maven test
        run: mvn test

      # 4. Run Checkstyle
      - name: Checkstyle
        run: mvn checkstyle:checkstyle

      # 5. Setup sonar-scanner (Upgraded to v8 to ensure compatibility with modern environments)
      - name: Setup SonarQube
        uses: warchant/setup-sonar-scanner@v8

      # 6. Run sonar-scanner with expanded binary paths
      - name: SonarQube Scan
        run: |
          sonar-scanner \
            -Dsonar.host.url=${{ secrets.SONAR_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.junit.reportsPath=target/surefire-reports/ \
            -Dsonar.jacoco.reportsPath=target/jacoco.exec \
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml \
            -Dsonar.java.binaries=target/classes,target/test-classes

      # 7. SonarQube Quality Gate check (Upgraded to v2/master)
      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@v2
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

      # 8. Output Status
      - name: "Example show SonarQube Quality Gate Status value"
        run: echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"
